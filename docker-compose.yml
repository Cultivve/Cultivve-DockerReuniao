version: '3.8'

services:
  selenium-hub:
    image: selenium/hub:latest
    container_name: selenium-hub
    ports:
      - "4444:4444"
    volumes:
      - ./chrome-profile:/home/seluser/chrome-profile 
    environment:
      - GRID_MAX_SESSION=4
      - GRID_TIMEOUT=60
    networks:
      - selenium-network

  chrome:
    image: selenium/node-chrome:latest
    container_name: selenium-node-chrome
    shm_size: 2gb
    depends_on:
      - selenium-hub
    ports:
      - "7900:7900"  
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - NODE_MAX_SESSION=2
    networks:
      - selenium-network

networks:
  selenium-network:
    driver: bridge
